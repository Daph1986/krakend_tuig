{% extends 'main.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block title %} Wachtwoord wijzigen {% endblock %}

{% block page_header %}
<div class="container mb-3">
  <div class="row text-center">
    <h2 class="mt-5 mb-2 mx-md-auto col-12">
      Wachtwoord wijzigen
    </h2>
  </div>
</div>
{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 500px;">
  <form method="post" class="p-3">
    {% csrf_token %}
    {{ form|crispy }}

    <div class="d-flex justify-content-between mt-4">
      <button class="btn hvr-grow btn-outline-success btn-gen-spec me-4" type="submit">
        <i class="fa-regular fa-floppy-disk me-2"></i>Opslaan
      </button>
      <a class="btn hvr-grow btn-outline-secondary btn-gen-spec"
         href="{% url 'accounts:profile_detail' %}">
        Annuleren
      </a>
    </div>
  </form>
</div>
<div class="mb-10"></div>
{% endblock %}
