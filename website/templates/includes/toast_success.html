{% load i18n %}
<!-- Succes -->
<div class="toast hd-toast rounded-3 border-3 border-success-custom" role="alert" aria-live="assertive" 
  aria-atomic="true">
  <div class="toast-header bg-success-custom text-sand">
      <strong class="me-auto">{% trans 'Gelukt!' %}</strong>
      <button type="button" class="btn-close text-black" data-bs-dismiss="toast" aria-label="Close"></button>
  </div>
  <div class="toast-body bg-sand">
    {{ message }}
  </div>
</div>
