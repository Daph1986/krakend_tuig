{% load i18n %}
<!-- Warning -->
<div class="toast hd-toast rounded-3 border-3 border-warning" role="alert" aria-live="assertive" 
  aria-atomic="true" data-bs-autohide="false">
  <div class="toast-header bg-warning text-black">
      <strong class="me-auto">{% trans 'Let op!' %}</strong>
      <button type="button" class="btn-close text-black" data-bs-dismiss="toast" aria-label="Close"></button>
  </div>
  <div class="toast-body bg-white">
    {{ message }}
  </div>
</div>
